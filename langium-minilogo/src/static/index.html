<!DOCTYPE html>
<html>
    <head>
        <meta charset='utf-8'>
        <!-- Page & Monaco styling -->
        <link href="styles.css" rel="stylesheet"/>
        <title>MiniLogo in Langium</title>
    </head>
    <body>
        <h1>MiniLogo in Langium</h1>

        <!-- Use a wrapper to display Monaco + Canvas side-by-side -->
        <div id="page-wrapper">
            <!-- Monaco half -->
            <div class="half">
                <div class="wrapper">
                    <div id="monaco-editor-root"></div>
                </div>
            </div>
            <!-- Canvas half -->
            <div class="half canvas-container">
                <canvas id='minilogo-canvas' width=500 height=600></canvas>
                <!-- Control buttons -->
                <div class="control-buttons">
                    <button id="load-btn">Load Code</button>
                    <button id="execute-btn">Execute Program</button>
                    <button id="step-btn" disabled>Step</button>
                    <button id="clear-btn">Clear Canvas</button>
                </div>
            </div>
        </div>

        <!-- Code version timeline -->
        <div class="timeline-container">
            <h3>Code Versions Timeline</h3>
            <div class="timeline" id="code-timeline">
                <!-- Timeline nodes will be added dynamically -->
            </div>
        </div>

        <!-- Status message location -->
        <div style="text-align:center">
            <span id="status-msg"></span>
        </div>

        <br/>
        <footer>
            <br/>
            <p style="font-style:italic">Powered by</p>
            <img width="125" src="https://langium.org/assets/langium_logo_w_nib.svg" alt="Langium">
        </footer>
        <!-- Monaco Configuration -->
        <script type="module" src="minilogo.js"></script>
    </body>
</html>
